<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CANAL Sr. VAQUINHA - Relógio Multifuso</title>
</head>
<body>
    <main class="container">
        <!-- Cabeçalho e Relógio Principal -->
        <header class="header-main">
            <h1>HORÁRIO DE BRASÍLIA</h1>
            <p id="date" class="date-display"></p>
            <p id="relogio01" class="clock-main"></p>
        </header>

        <!-- Grid com os Fusos Secundários -->
        <section class="clocks-grid">
            <div class="clock-card">
                <h2>FERNANDO DE NORONHA</h2>
                <div id="relogio2" class="clock-sub">--:--:--</div>
            </div>

            <div class="clock-card">
                <h2>AMAZONAS</h2>
                <div id="relogio3" class="clock-sub">--:--:--</div>
            </div>

            <div class="clock-card">
                <h2>ACRE</h2>
                <div id="relogio4" class="clock-sub">--:--:--</div>
            </div>
        </section>

        <!-- Rodapé / Créditos -->
        <footer class="footer">
            <p class="sr">
                Canal Sr. Vaquinha By: Júlio Aires - 
                <a href="https://www.youtube.com/channel/UC3ACLDxuy75577-GDItIgNA" target="_blank" rel="noopener noreferrer">₢ Canal Sr. Vaquinha</a>
            </p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
